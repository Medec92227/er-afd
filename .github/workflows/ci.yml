name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: make config
      - run: make build
      - run: make test
      - run: python3 -m tests.metricas
      - name: Códigos de retorno
        run: |
          set +e
          ./dist/er-afd 'a*b' 'aaab' > /dev/null; test $? -eq 1 || exit 1
          ./dist/er-afd 'a*b' 'aaac' > /dev/null; test $? -eq 0 || exit 1
          ./dist/er-afd '[z-a]' 'a' 2> /dev/null; test $? -eq 2 || exit 1
      - run: make run
      - run: make clean
