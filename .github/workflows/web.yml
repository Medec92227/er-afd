name: Página web (Azure)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: make test
      - run: make web
      - name: Publicar en Azure Static Web Apps
        # Se omite hasta que el secreto AZURE_STATIC_WEB_APPS_API_TOKEN exista en el repositorio.
        if: env.AZURE_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_TOKEN }}
          action: upload
          app_location: dist/web
          skip_app_build: true
          skip_api_build: true
