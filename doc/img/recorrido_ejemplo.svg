<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">ER-AFD: de una expresión a un recorrido verificable</title>
<desc id="desc">Ejemplo calculado: la expresión (a|b)*abb construye un AFND de 14 estados y un AFD de 6. La cadena aabb recorre Q0, Q1, Q1, Q4, Q5 y es aceptada.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#5f7c99"/></marker></defs>
<rect width="1100" height="510" rx="20" fill="#0c2036"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="46" y="53" fill="#5dd8cb" font-size="14" font-weight="700" letter-spacing="2">LENGUAJES FORMALES · CONSTRUCCIÓN EXPLÍCITA</text>
<text x="46" y="104" fill="#ffffff" font-size="36" font-weight="700">De la expresión a la decisión.</text>
<text x="46" y="137" fill="#b6c9dc" font-size="18">Thompson → subconjuntos → simulación por tabla</text>
<rect x="46" y="172" width="300" height="92" rx="10" fill="#17334f"/>
<text x="66" y="201" fill="#b6c9dc" font-size="13" letter-spacing="1">EXPRESIÓN REGULAR</text>
<text x="66" y="239" fill="#ffffff" font-family="Consolas, monospace" font-size="30">(a|b)*abb</text>
<path d="M358 218 H395" stroke="#5f7c99" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="412" y="172" width="289" height="92" rx="10" fill="#17334f"/>
<text x="432" y="201" fill="#b6c9dc" font-size="13" letter-spacing="1">AFND · THOMPSON</text>
<text x="432" y="238" fill="#ffffff" font-size="26">14 estados</text>
<path d="M714 218 H752" stroke="#5f7c99" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="768" y="172" width="286" height="92" rx="10" fill="#17334f"/>
<text x="788" y="201" fill="#b6c9dc" font-size="13" letter-spacing="1">AFD · SUBCONJUNTOS</text>
<text x="788" y="238" fill="#ffffff" font-size="26">6 estados</text>
<text x="46" y="307" fill="#b6c9dc" font-size="15">Entrada: <tspan fill="#ffffff" font-family="Consolas, monospace" font-weight="700">aabb</tspan></text>
<g stroke="#5f7c99" stroke-width="2" marker-end="url(#arrow)">
<path d="M157 365 H267"/><path d="M345 365 H455"/><path d="M533 365 H643"/><path d="M721 365 H831"/>
</g>
<g fill="#5dd8cb" font-size="18" text-anchor="middle"><text x="212" y="348">a</text><text x="400" y="348">a</text><text x="588" y="348">b</text><text x="776" y="348">b</text></g>
<g fill="#17334f" stroke="#7695b4" stroke-width="2"><circle cx="120" cy="365" r="36"/><circle cx="308" cy="365" r="36"/><circle cx="496" cy="365" r="36"/><circle cx="684" cy="365" r="36"/></g>
<circle cx="872" cy="365" r="36" fill="#133f43" stroke="#5dd8cb" stroke-width="2"/><circle cx="872" cy="365" r="30" fill="none" stroke="#5dd8cb" stroke-width="2"/>
<g fill="#ffffff" font-size="23" text-anchor="middle"><text x="120" y="373">Q0</text><text x="308" y="373">Q1</text><text x="496" y="373">Q1</text><text x="684" y="373">Q4</text><text x="872" y="373">Q5</text></g>
<text x="948" y="358" fill="#5dd8cb" font-size="16" font-weight="700">ACEPTADA</text><text x="948" y="381" fill="#b6c9dc" font-size="14">Retorno 1</text>
<path d="M46 433 H1054" stroke="#294660"/>
<text x="46" y="468" fill="#b6c9dc" font-size="14">Visualización del recorrido calculado · cada flecha consume un carácter.</text>
<text x="1054" y="468" fill="#5dd8cb" font-size="14" text-anchor="end">ER-AFD / UMG</text>
</g></svg>
